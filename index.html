<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일일계획표</title>
<!-- Firebase v8 Compat SDK 추가 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<style>
:root{
  --paper:#F6F5F2; --card:#fff; --ink:#1E1C19; --ink2:#4A4641; --ink3:#8B857D;
  --rule:#E2DFD8; --rule2:#EEECE7;
  --week:#1F4E9C; --day:#C0261E; --sub:#1E1C19; --done:#3B7A5C; --mark:#F2C744;
  --dawn-bg:#FCF1CD; --dawn-ln:#DCB944;
  --work-bg:#E2E9F6; --work-ln:#4A6FA5;
  --eve-bg:#DFEFE1;  --eve-ln:#4E9160;
  --shadow:0 1px 2px rgba(30,28,25,.05), 0 6px 18px rgba(30,28,25,.04);
  --mono:ui-monospace,"Cascadia Mono",Consolas,"D2Coding",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI","Malgun Gothic","맑은 고딕",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--week);outline-offset:1px}

/* ── 로그인 화면 ─────────────────────────────── */
.authwall{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  display:flex;align-items:center;justify-content:center;z-index:9999;font-family:var(--sans)}
.authbox{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:48px 40px;
  width:100%;max-width:360px}
.authbox h1{margin:0 0 8px;font-size:28px;font-weight:700;color:var(--ink);text-align:center}
.authbox p{margin:0 0 32px;font-size:14px;color:var(--ink3);text-align:center}
.authfield{margin-bottom:20px}
.authfield label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px;letter-spacing:.05em}
.authfield input{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;font-size:14px;
  font-family:inherit;box-sizing:border-box}
.authfield input:focus{outline:none;border-color:var(--week);box-shadow:0 0 0 3px rgba(31,78,156,.1)}
.authbtn{width:100%;padding:12px;background:var(--week);color:#fff;border:none;border-radius:8px;
  font-weight:600;font-size:14px;cursor:pointer;margin-top:8px;transition:background .2s}
.authbtn:hover{background:#1a3a7a}
.authbtn:active{background:#0f2654}
.autherror{font-size:12px;color:#c0261e;margin-top:12px;text-align:center}


/* ── 상단 바 ─────────────────────────── */
.topbar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--rule);
  box-shadow:0 1px 0 rgba(0,0,0,.02)}
.topbar .rule{height:3px;background:var(--mark)}
.topbar .inner{display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}
.brand{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:-.01em;color:var(--ink);
  background:var(--mark);padding:3px 9px;border-radius:4px;white-space:nowrap}
.datenav{display:flex;align-items:center;gap:4px}
.nav-btn{width:30px;height:30px;border:1px solid var(--rule);background:var(--card);border-radius:6px;line-height:1}
.nav-btn:hover{background:var(--rule2)}
.today-btn{height:30px;padding:0 10px;border:1px solid var(--rule);background:var(--card);border-radius:6px}
.today-btn:hover{background:var(--rule2)}
.dateinput{height:30px;border:1px solid var(--rule);border-radius:6px;padding:0 6px;background:var(--card);font-family:var(--mono)}
.dtitle{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-left:2px}
.dtitle .dow{color:var(--ink3);font-weight:600;margin-left:4px}
.dtitle .badge{display:inline-block;vertical-align:2px;margin-left:6px;background:var(--mark);color:#4A3B00;
  font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;letter-spacing:.04em}
.spacer{flex:1}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{height:30px;padding:0 11px;border:1px solid var(--rule);background:var(--card);border-radius:6px;white-space:nowrap}
.tool:hover{background:var(--rule2)}
.tool.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.tool.primary:hover{background:#000}
.moreWrap{position:relative;display:flex;gap:6px}
.more{display:flex;gap:6px}
#btnMore{display:none;align-items:center;justify-content:center;width:32px;padding:0;font-size:16px;line-height:1}
.saveflag{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.08em;min-width:65px;text-align:right}

/* ── 탭(모바일) ───────────────────────── */
.tabs{display:none;gap:0;border-bottom:1px solid var(--rule);background:var(--card);position:sticky;top:var(--tabtop,52px);z-index:29}
.tabs button{flex:1;padding:10px 0;border:0;background:none;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* ── 레이아웃 ─────────────────────────── */
.wrap{max-width:1440px;margin:0 auto;padding:14px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}

.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.card>header{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--rule2)}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;font-weight:700}
.eyebrow small{font-family:var(--sans);letter-spacing:0;font-weight:600;color:var(--ink3);margin-left:6px;font-size:11px}
.card.week{border:2px solid var(--week)} .card.week .eyebrow{color:var(--week)}
.card.week>header{border-bottom-color:rgba(31,78,156,.25)}
.card.dayb{border:2px solid var(--day)}  .card.dayb .eyebrow{color:var(--day)}
.card.dayb>header{border-bottom-color:rgba(192,38,30,.22)}
.card.subt{border:2px solid var(--sub)}  .card.subt .eyebrow{color:var(--sub)}
.card.subt>header{border-bottom-color:rgba(30,28,25,.2)}
.card .body{padding:8px 12px 12px}
.hint{font-size:11px;color:var(--ink3)}

/* ── 항목 입력 ────────────────────────── */
.bigrow{display:grid;grid-template-columns:16px minmax(0,1fr) minmax(0,1.05fr);gap:0 8px;
  align-items:center;padding:5px 0;border-bottom:1px solid var(--rule2)}
.bigrow:last-child{border-bottom:0}
.idx{font-family:var(--mono);font-size:11px;color:var(--ink3);text-align:right}
.btitle{display:flex;align-items:center;gap:6px;min-width:0}
.ti{width:100%;border:0;border-bottom:1px solid transparent;background:none;padding:3px 2px;font-weight:600}
.ti:hover{border-bottom-color:var(--rule)}
.ti:focus{border-bottom-color:var(--week);outline:none}
.subs{display:flex;flex-direction:column;gap:1px;border-left:1px solid var(--rule2);
  padding-left:9px;min-width:0}
.subline{display:flex;align-items:center;gap:6px;padding-left:2px}
.arrow{color:var(--ink3);font-size:10px;user-select:none}
.si{flex:1;border:0;background:none;padding:2px;font-size:13px;color:var(--ink2);border-bottom:1px solid transparent}
.si:hover{border-bottom-color:var(--rule)} .si:focus{border-bottom-color:var(--day);outline:none}
.chk{appearance:none;-webkit-appearance:none;width:15px;height:15px;flex:none;border:1.5px solid var(--rule);border-radius:4px;background:var(--card);position:relative;cursor:pointer}
.chk:hover{border-color:var(--ink3)}
.chk:checked{background:var(--done);border-color:var(--done)}
.chk:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.done{text-decoration:line-through;color:var(--ink3);text-decoration-thickness:1px}

.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.subitem{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px dashed var(--rule2)}
.subitem input[type=text]{flex:1;border:0;background:none;padding:2px;border-bottom:1px solid transparent}
.subitem input[type=text]:hover{border-bottom-color:var(--rule)}
.subitem input[type=text]:focus{border-bottom-color:var(--sub);outline:none}
.carry{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:#8a6b1f;background:#FBF2D4;border:1px solid #EEDFA6;padding:0 4px;border-radius:3px;flex:none}
/* ── BACKLOG (중장기 과제) ─────────────────── */
.card.bl{border-top-color:#7a5ea8}
.card.bl .eyebrow{color:#6b4f99}
.blitem{display:flex;align-items:center;gap:7px;padding:5px 2px;border-bottom:1px dashed var(--rule2)}
.blitem .chk{flex:none}
.blitem .bt{flex:1 1 auto;min-width:0;border:0;background:none;padding:2px;
  border-bottom:1px solid transparent;font-family:inherit;font-size:inherit;color:inherit}
.blitem .bw{flex:0 0 96px;border:0;background:none;padding:2px;text-align:right;
  border-bottom:1px solid transparent;font-family:inherit;font-size:12px;color:var(--ink3)}
.blitem input:hover{border-bottom-color:var(--rule)}
.blitem input:focus{border-bottom-color:#7a5ea8;outline:none}
.blitem .bt.done,.blitem .bw.done{text-decoration:line-through;color:var(--ink3)}
.blitem .bdel{flex:none;border:0;background:none;color:var(--ink3);cursor:pointer;
  font-size:15px;line-height:1;padding:2px 4px;border-radius:4px;opacity:.35}
.blitem:hover .bdel{opacity:1}
.blitem .bdel:hover{background:#f7e6e4;color:#c0261e}
.blitem.isdone .bt,.blitem.isdone .bw{opacity:.55}
.bldone-bar{display:flex;align-items:center;gap:8px;padding:7px 2px 4px;margin-top:4px;
  border-top:1px solid var(--rule2)}
.bldone-bar .spacer{flex:1}
.bltoggle{border:0;background:none;padding:0;font-family:inherit;font-size:12px;
  color:var(--ink3);cursor:pointer;letter-spacing:.02em}
.bltoggle:hover{color:#6b4f99}
.blclear{border:0;background:none;padding:0;font-family:inherit;font-size:11px;
  color:var(--ink3);cursor:pointer;opacity:.7}
.blclear:hover{color:#c0261e;opacity:1;text-decoration:underline}
.bldone-sep{border-top:1px solid var(--rule2);margin-top:4px;padding-top:2px}
.bladd{margin-top:8px;border:1px dashed var(--rule);background:none;border-radius:6px;
  padding:6px 12px;font-family:inherit;font-size:12px;color:var(--ink3);cursor:pointer}
.bladd:hover{border-color:#7a5ea8;color:#6b4f99}
.blempty{padding:10px 2px;font-size:12px;color:var(--ink3)}
.memo{width:100%;min-height:74px;border:0;background:none;resize:vertical;padding:2px;line-height:1.6}
.memo:focus{outline:none}

/* ── 리츄얼 ───────────────────────────── */
.rgroup+.rgroup{border-top:1px solid var(--rule2)}
.rgroup[data-g="am"]{border-left:4px solid var(--dawn-ln)}
.rgroup[data-g="work"]{border-left:4px solid var(--work-ln)}
.rgroup[data-g="pm"]{border-left:4px solid var(--eve-ln)}
.rhead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#FBFAF8}
.rgroup[data-g="am"] .rhead{background:var(--dawn-bg)}
.rgroup[data-g="work"] .rhead{background:var(--work-bg)}
.rgroup[data-g="pm"] .rhead{background:var(--eve-bg)}
.rgroup[data-g="am"] .rcat{color:#8A6B1B}
.rgroup[data-g="work"] .rcat{color:#3A5885}
.rgroup[data-g="pm"] .rcat{color:#3C7350}
.rhead h3{margin:0;font-size:12px;font-weight:700;letter-spacing:-.01em}
.gauge{flex:1;height:4px;background:var(--rule2);border-radius:2px;overflow:hidden}
.gauge i{display:block;height:100%;background:var(--done);width:0;transition:width .18s ease}
.gcount{font-family:var(--mono);font-size:10px;color:var(--ink3);min-width:34px;text-align:right}
.allbtn{border:1px solid var(--rule);background:var(--card);border-radius:5px;font-size:11px;padding:2px 7px}
.allbtn:hover{background:var(--rule2)}
.rrow{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:5px 12px;border-top:1px dotted var(--rule2)}
.rcat{font-size:11px;color:var(--ink3);padding-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);background:var(--card);
  border-radius:20px;padding:2px 9px 2px 7px;font-size:12px;color:var(--ink2);line-height:1.6}
.chip:hover{border-color:var(--ink3)}
.chip .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--rule);flex:none}
/* 지금 할 시간대의 미완료 항목만 은은하게 맥박 */
@keyframes ritpulse{
  0%,100%{border-color:var(--rule);background:var(--card);box-shadow:0 0 0 0 rgba(192,38,30,0)}
  50%    {border-color:#e0a49f;background:#fdf3f2;box-shadow:0 0 0 3px rgba(192,38,30,.08)}
}
@keyframes ritdot{
  0%,100%{background:transparent;border-color:var(--rule)}
  50%    {background:#d9695f;border-color:#d9695f}
}
.chip.due{animation:ritpulse 1.8s ease-in-out infinite}
.chip.due .dot{animation:ritdot 1.8s ease-in-out infinite}
.rgroup.duegroup .rhead h3::after{content:"● 지금";font-size:10px;color:#c0261e;
  margin-left:7px;letter-spacing:.04em;animation:ritpulse 1.8s ease-in-out infinite;
  border:0;background:none;box-shadow:none}
.nudgebtn{border:1px solid var(--rule);background:var(--card);border-radius:5px;
  font-size:11px;padding:2px 7px;color:var(--ink3);cursor:pointer}
.nudgebtn.on{border-color:#e0a49f;background:#fdf3f2;color:#c0261e}
/* 움직임을 불편해하는 설정이면 애니메이션 없이 색으로만 표시 */
@media (prefers-reduced-motion:reduce){
  .chip.due{animation:none;border-color:#e0a49f;background:#fdf3f2}
  .chip.due .dot{animation:none;background:#d9695f;border-color:#d9695f}
  .rgroup.duegroup .rhead h3::after{animation:none}
}
.chip.on{background:#EEF6F1;border-color:#B9DBC8;color:var(--done)}
.chip.on .dot{background:var(--done);border-color:var(--done)}
.fieldin{border:0;border-bottom:1px solid var(--rule);background:none;font-size:12px;padding:1px 4px;
  width:96px;flex:none}
.fieldin.wide{width:auto;flex:1;min-width:120px}
.fieldin:focus{outline:none;border-bottom-color:var(--week)}

/* ── 타임레일 ─────────────────────────── */
.railhead{display:grid;grid-template-columns:62px 6px 1fr;gap:0 8px;padding:6px 14px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink3);border-bottom:1px solid var(--rule2)}
.rail{padding:0 14px 12px;display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.slot{display:grid;grid-template-columns:62px 6px 1fr;gap:0 8px;align-items:stretch;
  flex:1 1 0;min-height:34px}
.slot .t{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.12;
  font-variant-numeric:tabular-nums;border-top:1px solid rgba(0,0,0,.06)}
.slot .t b{font-weight:600}
.slot .t i{font-style:normal;font-size:10px;font-weight:400;color:var(--ink3);letter-spacing:-.02em}
.slot.band-dawn .t{background:var(--dawn-bg);border-left:3px solid var(--dawn-ln)}
.slot.band-work .t{background:var(--work-bg);border-left:3px solid var(--work-ln)}
.slot.band-eve  .t{background:var(--eve-bg); border-left:3px solid var(--eve-ln)}
.slot:first-child .t{border-top-left-radius:4px;border-top-right-radius:4px}
.slot:last-child .t{border-bottom-left-radius:4px;border-bottom-right-radius:4px}
.slot.hourtop .t{font-weight:700}
.spine{border-radius:3px;background:transparent}
.slot input{border:0;background:none;padding:4px 6px;min-width:0;border-top:1px solid var(--rule2);
  font-size:15px;color:var(--ink)}
.slot input:focus{outline:none;background:#FFFCEE}
.slot.hourtop input{border-top-color:var(--rule)}
.slot.blockstart input{font-weight:600}
.slot.blockcont input{color:transparent}
.slot.blockcont input:focus{color:var(--ink)}
.slot.lunch .t{color:#B4531B}
.card.p-time{display:flex;flex-direction:column}
.now{position:relative}
.now::before{content:"";position:absolute;left:0;right:0;height:2px;background:var(--mark);z-index:2}

/* ── 통계 ─────────────────────────────── */
.stat{display:grid;grid-template-columns:1fr 46px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--rule2)}
.stat b{font-weight:500;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .bar{grid-column:1/3;height:3px;background:var(--rule2);border-radius:2px;overflow:hidden;margin-top:-2px}
.stat .bar i{display:block;height:100%;background:var(--week)}
.stat span{font-family:var(--mono);font-size:11px;color:var(--ink3);text-align:right}

/* ── 모달 ─────────────────────────────── */
.modal{position:fixed;inset:0;background:rgba(30,28,25,.42);display:none;z-index:60;padding:20px}
.modal.open{display:flex;align-items:flex-start;justify-content:center}
.sheet{background:var(--card);border-radius:12px;width:100%;max-width:760px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.28);margin-top:3vh}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.sheet header h2{margin:0;font-size:15px}
.sheet .content{padding:14px 16px;overflow:auto}
.sheet footer{padding:10px 16px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end}
.report{width:100%;min-height:380px;font-family:var(--mono);font-size:12px;line-height:1.7;border:1px solid var(--rule);border-radius:8px;padding:12px;background:#FBFAF8;resize:vertical}

/* ── 보고서 문서 양식 ── */
.rtabs{display:flex;gap:4px}
.rtabs button{border:1px solid var(--rule);background:var(--card);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--ink3)}
.rtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.docmeta{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-bottom:10px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
.docmeta input{border:0;border-bottom:1px solid var(--rule);padding:2px 4px;font-size:12px;width:96px}
.docmeta input:focus{outline:none;border-bottom-color:var(--week)}
.doc{background:#fff;color:#141210;padding:4px 2px}
.doc h1{text-align:center;font-size:20px;letter-spacing:.5em;margin:6px 0 2px;font-weight:800;text-indent:.5em}
.doc .period{text-align:center;font-size:12px;color:#5a564f;margin-bottom:14px}
.doc h2{font-size:13px;margin:16px 0 6px;padding-left:7px;border-left:4px solid var(--week);font-weight:700}
.doc table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.doc th,.doc td{border:1px solid #B5B2AB;padding:5px 7px;vertical-align:top;word-break:break-word}
.doc th{background:#EEEDE9;font-weight:700;text-align:center;font-size:11.5px}
.doc td.c{text-align:center;white-space:nowrap}
.doc ul{margin:0;padding-left:14px}
.doc li{margin:1px 0}
.doc .st-done{color:#1B6B44;font-weight:700}
.doc .st-ing{color:#B4531B;font-weight:700}
.doc .st-no{color:#9B968E}
.doc .empty{color:#9b968e}
.doc .sign{margin-top:16px;text-align:right;font-size:12px;color:#5a564f}

/* ── 통계 ── */
.rangebar{display:flex;gap:4px;margin-bottom:12px}
.rangebar button{border:1px solid var(--rule);background:var(--card);border-radius:6px;padding:4px 11px;font-size:12px;color:var(--ink3)}
.rangebar button.on{background:var(--week);color:#fff;border-color:var(--week);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{border:1px solid var(--rule);border-radius:8px;padding:9px 11px;background:#FBFAF8}
.kpi small{display:block;font-size:11px;color:var(--ink3);margin-bottom:2px}
.kpi b{font-family:var(--mono);font-size:19px;font-weight:700}
.kpi b i{font-size:11px;font-style:normal;color:var(--ink3);font-weight:400;margin-left:2px}
.gbar{display:grid;grid-template-columns:74px 1fr 52px;gap:8px;align-items:center;padding:5px 0}
.gbar .track{height:9px;background:var(--rule2);border-radius:5px;overflow:hidden}
.gbar .track i{display:block;height:100%;border-radius:5px}
.gbar span:last-child{font-family:var(--mono);font-size:11px;color:var(--ink3);text-align:right}
.gbar b{font-size:12px;font-weight:600}
.heat{display:flex;gap:3px;flex-wrap:wrap;margin:6px 0 2px}
.heat i{width:17px;height:17px;border-radius:3px;display:block;border:1px solid rgba(0,0,0,.06)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.tbl th,.tbl td{border-bottom:1px solid var(--rule2);padding:5px 6px;text-align:left}
.tbl th{font-size:11px;color:var(--ink3);font-weight:600}
.tbl td.n{text-align:right;font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.mini-track{height:5px;background:var(--rule2);border-radius:3px;overflow:hidden;margin-top:3px}
.mini-track i{display:block;height:100%}
.sechead{font-size:12px;font-weight:700;margin:16px 0 4px;color:var(--ink2)}
.editarea{width:100%;height:150px;font-family:var(--mono);font-size:12px;border:1px solid var(--rule);border-radius:8px;padding:10px;line-height:1.7}
.printhead{display:none;align-items:center;gap:8px;border-bottom:2px solid var(--ink);
  padding:0 0 2mm;margin:0 0 2.5mm;grid-column:1 / -1}
.printhead b{font-size:12pt;letter-spacing:.02em}
.printhead .pd{font-size:11pt;font-weight:700}
.printhead .pw{margin-left:auto;font-size:8pt;color:#555}
.memoprint{display:none;white-space:pre-wrap;font-size:7.5pt;line-height:1.45}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%)}

/* 반쪽 창(~940px)에서도 원본처럼 좌우 2단 유지 · 밀도만 압축 */
@media (max-width:1120px){
  .wrap{padding:10px;gap:10px}
  .card .body{padding:6px 10px 10px}
  .card>header{padding:7px 10px}
  .rail{padding:0 10px 8px}
  .railhead{padding:4px 10px}
  .slot,.railhead{grid-template-columns:48px 5px 1fr}
  .slot{min-height:31px;grid-template-columns:58px 6px 1fr}

  .dtitle{font-size:17px}
  #btnMore{display:inline-flex}

  .more .tool{border:0;text-align:left;height:30px}

@media (max-width:820px){

/* 같은 분류가 여러 줄로 나뉘어 있으면 한 줄로 합침 */
function normalizeRituals(gs){
  gs.forEach(g=>{
    const m=new Map();
    g.rows.forEach(r=>{
      const cat=r[0];
      if(!m.has(cat))m.set(cat,[cat]);
      r.slice(1).forEach(v=>{if(!m.get(cat).includes(v))m.get(cat).push(v);});
    });
    g.rows=[...m.values()];
  });
  return gs;
}

/* ══ 정규화 ══════════════════════════════════════════════════════
   Firebase 실시간 DB는 "빈 객체 / 빈 배열 / null"을 저장하지 않고 지웁니다.
   그래서 slots·rit·fields 같은 값이 통째로 사라진 채 돌아오고,
   d.slots[t] 접근에서 TypeError가 나면서 화면이 멈춰 있었습니다.
   또 배열이 객체({"0":..,"1":..})로 바뀌어 오는 경우도 있어 함께 복구합니다. */
function toArr(v){
  if(Array.isArray(v))return v.filter(x=>x!=null);
  if(v&&typeof v==="object")return Object.keys(v).sort((a,b)=>a-b).map(k=>v[k]).filter(x=>x!=null);
  return [];
}
function normSub(s){s=s||{};return{t:typeof s.t==="string"?s.t:"",done:!!s.done};}
function normBig(b){b=b||{};
  const subs=toArr(b.subs).map(normSub);
  while(subs.length<BIGSUB_COUNT)subs.push({t:"",done:false});
  const o={t:typeof b.t==="string"?b.t:"",done:!!b.done,carry:!!b.carry,subs};
  if(typeof b.ct==="string")o.ct=b.ct;      // 이월 원본 문구 보존
  if(typeof b.cd==="string")o.cd=b.cd;      // 내가 지운 이월 항목 기억
  return o;}
function normBigList(v){const a=toArr(v).map(normBig);
  while(a.length<3)a.push(normBig());return a;}
function normDay(d,k){d=(d&&typeof d==="object")?d:{};
  d.date=d.date||k;
  d.big=normBigList(d.big);
  const subs=toArr(d.subs).map(s=>{
    const o={t:(s&&typeof s.t==="string")?s.t:"",done:!!(s&&s.done),carry:!!(s&&s.carry)};
    if(s&&typeof s.ct==="string")o.ct=s.ct;
    if(s&&typeof s.cd==="string")o.cd=s.cd;
    return o;});
  while(subs.length<SUB_COUNT)subs.push({t:"",done:false,carry:false});
  d.subs=subs;
  d.memo=typeof d.memo==="string"?d.memo:"";
  d.slots=(d.slots&&typeof d.slots==="object")?d.slots:{};
  /* slots 내의 각 항목도 {p: "", a: ""} 형태로 통일 */
  Object.keys(d.slots).forEach(k=>{
    const sv=d.slots[k];
    if(!sv||typeof sv!=="object"){d.slots[k]={p:"",a:""};return;}
    d.slots[k]={
      p:typeof sv.p==="string"?sv.p:"",
      a:typeof sv.a==="string"?sv.a:""
    };
  });
  d.rit  =(d.rit  &&typeof d.rit  ==="object")?d.rit  :{};
  d.fields=(d.fields&&typeof d.fields==="object")?d.fields:{};
  d.u=Number(d.u)||0;
  return d;}
function normRituals(v){
  const gs=toArr(v).map(g=>({id:g&&g.id,name:(g&&g.name)||"",
    rows:toArr(g&&g.rows).map(r=>toArr(r).map(x=>String(x==null?"":x))).filter(r=>r.length)}))
    .filter(g=>g.id&&g.rows.length);
  return gs.length?normalizeRituals(gs):defaultRituals();}
function normBacklog(v){
  return toArr(v).map(b=>({
    t:(b&&typeof b.t==="string")?b.t:"",
    w:(b&&typeof b.w==="string")?b.w:"",
    done:!!(b&&b.done)
  }));
}
function normalizeDB(raw){
  const d=(raw&&typeof raw==="object")?raw:{};
  d.v=1;
  d.backlog=normBacklog(d.backlog);
  d.bu=Number(d.bu)||0;          // backlog 수정 시각
  d.days=(d.days&&typeof d.days==="object")?d.days:{};
  Object.keys(d.days).forEach(k=>{d.days[k]=normDay(d.days[k],k);});
  d.weeks=(d.weeks&&typeof d.weeks==="object")?d.weeks:{};
  Object.keys(d.weeks).forEach(k=>{const w=d.weeks[k]||{};d.weeks[k]={big:normBigList(w.big),u:Number(w.u)||0};});
  d.rituals=normRituals(d.rituals);
  d.settings=(d.settings&&typeof d.settings==="object")?d.settings:{};
  if(typeof d.settings.nudge!=="boolean")d.settings.nudge=true;
  d.font=d.font||"sys";
  return d;
}

/* ══ 병합: 원격을 그대로 덮어쓰지 않고, 더 최근 것만 채택 ══
   (사무실/집에서 동시에 열어두어도 한쪽 기록이 사라지지 않도록) */
/* 내용이 있는지 판정 — 빈 껍데기가 실제 기록을 덮어쓰지 못하게 하는 기준 */
function hasBig(list){return toArr(list).some(b=>b&&(
  (typeof b.t==="string"&&b.t.trim())||
  toArr(b.subs).some(x=>x&&typeof x.t==="string"&&x.t.trim())));}
function dayHasContent(d){
  if(!d)return false;
  if(hasBig(d.big))return true;
  if(toArr(d.subs).some(x=>x&&x.t&&x.t.trim()))return true;
  if(d.memo&&d.memo.trim())return true;
  if(d.slots&&Object.keys(d.slots).some(k=>{const v=d.slots[k];
    return v&&((v.p&&v.p.trim())||(v.a&&v.a.trim()));}))return true;
  if(d.rit&&Object.keys(d.rit).some(k=>d.rit[k]))return true;
  if(d.fields&&Object.keys(d.fields).some(k=>(d.fields[k]||"").trim()))return true;
  return false;
}
function weekHasContent(w){return !!w&&hasBig(w.big);}

/* 한쪽만 내용이 있으면 그쪽을 채택. 둘 다 있으면 시각으로 비교.
   ★ 빈 쪽이 시각만 최신이라는 이유로 이기는 일은 없어야 합니다. */
function pick(l,r,hasContent){
  const lc=hasContent(l),rc=hasContent(r);
  if(lc&&!rc)return "local";
  if(rc&&!lc)return "remote";
  if(!lc&&!rc)return r?"remote":"local";
  return (l.u||0)>(r.u||0)?"local":"remote";
}

let mergeKeptLocal=false;
function mergeDB(local,remote){
  const out=normalizeDB(remote);
  const L=normalizeDB(local);
  mergeKeptLocal=false;
  Object.keys(L.days).forEach(k=>{
    const l=L.days[k],r=out.days[k];
    if(!r||pick(l,r,dayHasContent)==="local"){out.days[k]=l;mergeKeptLocal=true;}
  });
  Object.keys(L.weeks).forEach(k=>{
    const l=L.weeks[k],r=out.weeks[k];
    if(!r||pick(l,r,weekHasContent)==="local"){out.weeks[k]=l;mergeKeptLocal=true;}
  });
  if(!remote||!remote.rituals)out.rituals=L.rituals;
  if((L.bu||0)>(out.bu||0)){out.backlog=L.backlog;out.bu=L.bu;mergeKeptLocal=true;}
  out.font=L.font||out.font;
  return out;
}

const APP_VER="v9.1";

/* ══════════════════════════════════════════════════════════════════
   자동 백업 시스템
====================================================================== */

const BK_PREFIX  = "planner_backup_";   // 일자별 스냅샷
const BK_SNAP    = "planner_snap_";     // 변경 직전 자동 스냅샷
const BK_LAST    = "planner_backup_last";
const BK_KEEP    = 10;   // 일자별 보관 개수
const BK_SNAPKEEP= 8;    // 직전 스냅샷 보관 개수

/* 내용이 있는 데이터인지 (빈 상태를 백업으로 남기지 않기 위함) */
function dbHasContent(x){
  if(!x)return false;
  if(x.days&&Object.keys(x.days).some(k=>dayHasContent(x.days[k])))return true;
  if(x.weeks&&Object.keys(x.weeks).some(k=>weekHasContent(x.weeks[k])))return true;
  if(Array.isArray(x.backlog)&&x.backlog.some(b=>b&&b.t&&b.t.trim()))return true;
  return false;
}
function dbSize(x){
  try{
    const d=Object.keys(x.days||{}).filter(k=>dayHasContent(x.days[k])).length;
    const w=Object.keys(x.weeks||{}).filter(k=>weekHasContent(x.weeks[k])).length;
    return {d:d,w:w};
  }catch(e){return {d:0,w:0};}
}

function writeBackup(key,label){
  try{
    if(!dbHasContent(db)){console.log("[backup] 내용 없음 - 건너뜀");return false;}
    store.setItem(key,JSON.stringify(db));
    const n=dbSize(db);
    console.log("[backup] "+label+" 저장:",key,"("+n.d+"일 "+n.w+"주)");
    return true;
  }catch(e){
    console.error("[backup] 저장 실패:",e);
    /* 용량이 찼으면 오래된 것부터 비우고 한 번 더 시도 */
    if(e&&(e.name==="QuotaExceededError"||e.code===22)){
      pruneBackups(BK_SNAP,2);pruneBackups(BK_PREFIX,4);
      try{store.setItem(key,JSON.stringify(db));return true;}catch(e2){}
    }
    return false;
  }
}

function pruneBackups(prefix,keep){
  try{
    const ks=[];
    for(let i=0;i<store.length;i++){const k=store.key(i);
      if(k&&k.indexOf(prefix)===0)ks.push(k);}
    ks.sort().reverse();
    for(let i=keep;i<ks.length;i++){store.removeItem(ks[i]);}
  }catch(e){console.error("[backup] 정리 실패:",e);}
}

/* ① 하루 한 번 — 앱을 열거나 되돌아올 때, 마지막 백업이 오늘이 아니면 즉시 실행.
      기존에는 오후 6:30 정각에 창이 떠 있어야만 돌아서, 실제로는 한 번도
      실행되지 않았습니다. 이제 시각과 무관하게 그날 첫 사용 때 남습니다. */
function dailyBackupIfNeeded(){
  try{
    const today=key(new Date());
    if(store.getItem(BK_LAST)===today)return;
    if(writeBackup(BK_PREFIX+today,"일자별")){
      store.setItem(BK_LAST,today);
      pruneBackups(BK_PREFIX,BK_KEEP);
    }
  }catch(e){console.error("[backup] 일일 백업 실패:",e);}
}

/* ② 변경 직전 스냅샷 — 데이터가 줄어드는 순간, "줄어들기 전" 상태를 보관.
      이번처럼 기록이 비어버리는 사고에서 되돌릴 수 있는 안전망입니다.
      ★ 사고가 난 뒤의 db를 저장하면 의미가 없으므로, 직전 사본을 들고 있다가 그것을 씁니다. */
let lastSize={d:0,w:0};
let lastGood=null;          // 마지막으로 정상이었던 시점의 사본
function rememberGood(){
  try{
    if(!dbHasContent(db))return;
    lastGood=JSON.stringify(db);
    lastSize=dbSize(db);
  }catch(e){}
}
function writeRaw(key,json,label){
  try{
    store.setItem(key,json);
    console.log("[backup] "+label+" 저장:",key);
    return true;
  }catch(e){
    if(e&&(e.name==="QuotaExceededError"||e.code===22)){
      pruneBackups(BK_SNAP,2);pruneBackups(BK_PREFIX,4);
      try{store.setItem(key,json);return true;}catch(e2){}
    }
    console.error("[backup] 저장 실패:",e);
    return false;
  }
}
function snapshotIfShrinking(){
  try{
    const now=dbSize(db);
    if(!lastGood){rememberGood();return;}
    const shrank=(now.d<lastSize.d)||(now.w<lastSize.w);
    if(shrank){
      console.warn("[backup] 기록이 줄었습니다 - 줄기 전 상태를 보관합니다");
      writeRaw(BK_SNAP+new Date().toISOString().replace(/[:.]/g,"-"),lastGood,"직전 스냅샷");
      pruneBackups(BK_SNAP,BK_SNAPKEEP);
    }
    rememberGood();
  }catch(e){}
}

/* ③ 원격 데이터를 반영하기 직전 — 다른 기기가 보낸 내용으로 덮기 전에 현 상태 보관 */
function snapshotBeforeRemote(){
  try{
    if(!dbHasContent(db))return;
    rememberGood();     // 현재 상태를 정상 사본으로 기록
    writeRaw(BK_SNAP+new Date().toISOString().replace(/[:.]/g,"-"),lastGood,"원격 반영 전");
    pruneBackups(BK_SNAP,BK_SNAPKEEP);
  }catch(e){}
}

function scheduleAutoBackup(){
  rememberGood();                              // 시작 시점의 정상 사본 확보
  dailyBackupIfNeeded();                       // 지금 당장 한 번
  setInterval(dailyBackupIfNeeded,30*60*1000); // 30분마다 날짜 넘어갔는지 확인
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden)dailyBackupIfNeeded(); // 탭으로 돌아올 때도 확인
  });
  console.log("[backup] 자동 백업 활성화");
}

function listBackups(){
  const out=[];
  for(let i=0;i<store.length;i++){
    const k=store.key(i);if(!k)continue;
    if(k.indexOf(BK_PREFIX)===0&&k!==BK_LAST){
      out.push({key:k,date:k.replace(BK_PREFIX,""),kind:"일자별"});
    }else if(k.indexOf(BK_SNAP)===0){
      const raw=k.replace(BK_SNAP,"");
      out.push({key:k,date:raw.slice(0,10)+" "+raw.slice(11,16).replace("-",":"),kind:"자동"});
    }
  }
  return out.sort((a,b)=>a.key<b.key?1:-1);
}

function restoreBackup(key, label) {
  try {
    const backup = store.getItem(key);
    if (!backup) {
      alert("백업을 찾을 수 없습니다");
      return false;
    }
    const data = normalizeDB(JSON.parse(backup));
    /* 복원본과 현재 데이터를 합쳐, 백업 이후에 적은 내용이 사라지지 않게 함 */
    const t = Date.now();
    Object.keys(data.days).forEach(k=>{
      const b=data.days[k], c=db.days[k];
      if(!c||pick(b,c,dayHasContent)==="local"){b.u=t;db.days[k]=b;}
    });
    Object.keys(data.weeks).forEach(k=>{
      const b=data.weeks[k], c=db.weeks[k];
      if(!c||pick(b,c,weekHasContent)==="local"){b.u=t;db.weeks[k]=b;}
    });
    if(data.rituals&&data.rituals.length)db.rituals=data.rituals;
    if(data.backlog&&data.backlog.length){db.backlog=data.backlog;db.bu=t;}
    if(data.font)db.font=data.font;
    applyFont(db.font);
    saveLocal();
    render();
    
    if (useFirebase && currentUser) {
      cloudSynced = true;
      pushCloud();
    }
    
    const date = label || String(key).replace(BK_SNAP,"").replace(BK_PREFIX,"");
    toast("백업 복원됨: " + date);
    alert("백업이 복원되었습니다: " + date);
    return true;
  } catch (e) {
    console.error("[backup] 복원 실패:", e);
    alert("백업 복원에 실패했습니다: " + e.message);
    return false;
  }
}


/* ══ DB ══ */
let db=loadLocal();

function loadLocal(){
  try{
    const r=store.getItem(KEY);
    if(r)return normalizeDB(JSON.parse(r));
  }catch(e){console.error("[load] 로컬 데이터 파싱 실패",e);}
  return normalizeDB({});
}

let saveTimer=null;
let applyingRemote=false;   // 원격 반영 중(동기 구간)에는 되쏘지 않음
let pendingPush=false;      // 오프라인일 때 밀어둔 변경
let cloudOnline=false;
let cloudSynced=false;      // 클라우드 내용을 최소 1회 받아왔는지
let cloudListenerActive=false;  // 클라우드 리스너가 이미 활성화됐는지
let localSaved=true;        // 로컬 저장 상태
let cloudSaveSuccess=true;  // 클라우드 저장 성공 여부

function stamp(){
  const t=Date.now();
  /* 내용이 없는 껍데기에 최신 시각을 찍으면, 그 빈 데이터가 병합에서
     클라우드의 실제 기록을 이겨버립니다. 내용이 있을 때만 찍습니다. */
  const d=db.days[cur];
  if(d&&dayHasContent(d))d.u=t;
  const wk=mondayOf(cur),w=db.weeks[wk];
  if(w&&weekHasContent(w))w.u=t;
}

function saveLocal(){
  try{
    store.setItem(KEY,JSON.stringify(db));
    localSaved=true;
    return true;
  }catch(e){
    localSaved=false;
    console.error("[save] 로컬 저장 실패",e);
    return false;
  }
}

let pushRetry={timer:null,count:0,maxRetries:5};
function pushCloud(){
  if(!useFirebase||!fdb)return;
  if(!cloudSynced){pendingPush=true;flag("클라우드 확인 중…");return;}
  if(!cloudOnline){pendingPush=true;flag("오프라인 · 기기에 저장됨");return;}
  
  pendingPush=false;
  db._by=CLIENT_ID; db._ts=Date.now();
  flag("동기화 중…");
  
  const attempt=()=>{
    fdb.ref(CLOUD_PATH).set(JSON.parse(JSON.stringify(db)))
      .then(()=>{
        pushRetry.count=0;
        cloudSaveSuccess=true;
        flag("☁ 동기화됨 "+new Date().toTimeString().slice(0,5));
        clearTimeout(pushRetry.timer);
      })
      .catch(err=>{
        console.error("[sync] 쓰기 실패(시도 "+(pushRetry.count+1)+"/"+pushRetry.maxRetries+")",err);
        if(pushRetry.count<pushRetry.maxRetries){
          pushRetry.count++;
          const wait=Math.pow(2,pushRetry.count)*1000;
          flag("⚠ 재시도 중 ("+pushRetry.count+"/"+pushRetry.maxRetries+")");
          pushRetry.timer=setTimeout(attempt,wait);
        }else{
          cloudSaveSuccess=false;
          pendingPush=true;
          flag(err&&err.code==="PERMISSION_DENIED"?"⚠ 규칙 거부(쓰기)":"⚠ 동기화 실패");
        }
      });
  };
  attempt();
}

function save(now){
  /* 원격 반영 중에는 되쏘기만 막고, 그 외에는 절대 저장을 건너뛰지 않습니다.
     (기존 코드는 isRemoteUpdating 300ms 동안 입력을 통째로 버렸습니다) */
  if(applyingRemote)return;
  clearTimeout(saveTimer);
  const go=()=>{
    stamp();
    snapshotIfShrinking();
    const okLocal=saveLocal();
    if(!useFirebase){flag(okLocal?"이 기기에 저장됨":"⚠ 저장 실패");return;}
    if(!okLocal)flag("⚠ 로컬 저장 실패");
    pushCloud();
  };
  if(now)go();
  else{flag("입력 중…");saveTimer=setTimeout(go,800);}
}

function flag(t,icon=""){
  const el=document.getElementById("saveflag");
  if(!el)return;
  el.textContent=t;
  // 상태 아이콘 추가 (선택사항)
  if(icon){el.style.color=icon==="ok"?"#16a34a":icon==="warn"?"#ea580c":"#c0261e";}
}

/* ══ 날짜 ══ */
const DOW=["일","월","화","수","목","금","토"];
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return key(d);};
function mondayOf(s){const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return key(d);}
let cur=key(new Date());

/* ══ 하루 데이터 ══ */
const emptyBig=()=>{const s=[];
  for(let i=0;i<BIGSUB_COUNT;i++)s.push({t:"",done:false});
  return{t:"",done:false,subs:s};};
function ensureWeek(wk){
  if(!db.weeks[wk])db.weeks[wk]={big:[emptyBig(),emptyBig(),emptyBig()]};
  const w=db.weeks[wk];while(w.big.length<3)w.big.push(emptyBig());return w;
}
/* 클라우드 첫 수신 전에 만들어진 빈 껍데기를 정리 — 실제 기록이 도착할 자리를 비워둠 */
function dropEmptyShells(){
  Object.keys(db.days).forEach(k=>{if(!dayHasContent(db.days[k]))delete db.days[k];});
  Object.keys(db.weeks).forEach(k=>{if(!weekHasContent(db.weeks[k]))delete db.weeks[k];});
}
function lastDayBefore(d){
  const ks=Object.keys(db.days).filter(k=>k<d).sort();return ks.length?ks[ks.length-1]:null;
}
/* ══ 이월 처리 ═══════════════════════════════════════════════════
   기존에는 그 날짜를 "처음 여는 순간" 한 번만 계산하고 굳어버렸습니다.
   그래서 미리 다음날을 열어본 뒤 오늘 업무를 완료해도, 다음날 칸에는
   완료된 항목이 그대로 남아 있었습니다.
   이제 날짜를 열 때마다 다시 검사하되,
   ─ 자동 이월된 뒤 손대지 않은 칸(ct === 현재 내용)만 정리하고
   ─ 직접 고쳤거나 체크한 칸은 절대 건드리지 않습니다. */

function pendingBigOf(p){        // 이전 날의 '미완료' 중요업무 (index 유지)
  return p.big.map(b=>(b&&b.t.trim()&&!b.done)?b:null);
}
function pendingSubsOf(p){       // 이전 날의 '미완료' 잔업무 문구 목록
  return p.subs.filter(s=>s.t.trim()&&!s.done).map(s=>s.t.trim());
}

/* 이월 항목을 현재 상태에 맞게 갱신. 바뀐 게 있으면 true */
function refreshCarry(dk){
  const day=db.days[dk]; if(!day)return false;
  const prev=lastDayBefore(dk); if(!prev)return false;
  const p=db.days[prev]; if(!p)return false;
  let changed=false;

  // ① 중요 업무(Daily Big) ─ 같은 자리끼리 비교
  const pbig=pendingBigOf(p);
  day.big.forEach((b,bi)=>{
    if(!b||!b.carry||b.done)return;              // 내가 체크하거나 고친 건 그대로 둠
    const src=pbig[bi];
    if(!src){                                    // 원본이 완료되었거나 지워짐 → 비움
      day.big[bi]=emptyBig();changed=true;
    }else if(src.t!==b.t){                       // 원본 문구가 바뀜 → 따라감
      b.t=src.t;b.ct=src.t;changed=true;
    }
  });

  // ② 잔업무(Sub things) ─ 문구로 비교
  const psubs=pendingSubsOf(p);
  day.subs.forEach(sv=>{
    if(!sv||!sv.carry||sv.done)return;
    const ct=(sv.ct!=null?sv.ct:sv.t);
    if(psubs.indexOf(ct.trim())===-1){           // 원본이 완료됨 → 비움
      sv.t="";sv.carry=false;delete sv.ct;changed=true;
    }
  });

  // ③ 이전 날에서 새로 밀려난 항목이 있으면 빈 칸에 채워 넣음
  const have=day.subs.filter(sv=>sv.t.trim()).map(sv=>sv.t.trim());
  const dropped=day.subs.filter(sv=>sv.cd).map(sv=>sv.cd);   // 내가 지운 이월 항목
  psubs.forEach(t=>{
    if(have.indexOf(t)!==-1||dropped.indexOf(t)!==-1)return;
    const slot=day.subs.find(sv=>!sv.t.trim()&&!sv.cd);
    if(slot){slot.t=t;slot.ct=t;slot.carry=true;have.push(t);changed=true;}
  });
  pbig.forEach((src,bi)=>{
    if(!src)return;
    const cell=day.big[bi];
    if(cell&&cell.t.trim())return;               // 이미 뭔가 적혀 있으면 손대지 않음
    if(cell&&cell.cd===src.t)return;             // 내가 지운 항목은 되살리지 않음
    day.big[bi]={t:src.t,ct:src.t,done:false,carry:true,
      subs:src.subs.map(x=>({t:x.done?"":x.t,done:false}))};
    changed=true;
  });

  return changed;
}

/* 앞선 날짜들이 굳어 있을 수 있으므로 최근 며칠을 순서대로 다시 계산 */
function refreshCarryChain(dk){
  const ks=Object.keys(db.days).filter(k=>k<=dk).sort().slice(-30);
  let changed=false;
  ks.forEach(k=>{if(refreshCarry(k))changed=true;});
  return changed;
}

function ensureDay(d){
  if(db.days[d]){
    if(!applyingRemote&&refreshCarryChain(d))saveLocal();
    return db.days[d];
  }
  const day={date:d,big:[emptyBig(),emptyBig(),emptyBig()],subs:[],memo:"",slots:{},rit:{},fields:{}};
  /* slots을 올바른 구조로 초기화 (SLOTS 배열의 모든 시간대) */
  SLOTS.forEach(t=>{day.slots[t]={p:"",a:""};});
  for(let i=0;i<SUB_COUNT;i++)day.subs.push({t:"",done:false,carry:false});
  const prev=lastDayBefore(d);
  if(prev){
    const p=db.days[prev];
    let i=0;const pend=pendingSubsOf(p);
    day.subs.forEach(sv=>{if(i<pend.length){sv.t=pend[i];sv.ct=pend[i];sv.carry=true;i++;}});
    if(i<pend.length)day.memo=pend.slice(i).map(t=>"· "+t+" (이월)").join("\n");
    p.big.forEach((b,bi)=>{if(b.t.trim()&&!b.done){
      day.big[bi]={t:b.t,ct:b.t,done:false,carry:true,
        subs:b.subs.map(x=>({t:x.done?"":x.t,done:false}))};}});
  }
  db.days[d]=day;
  /* 날짜만 넘겨봐도 전체 DB를 클라우드에 밀어올리던 부분.
     로컬에만 남기고, 실제 입력이 생길 때 동기화되도록 함 */
  if(!applyingRemote)saveLocal();
  return day;
}

/* ══ 시간 슬롯 ══ */
const SLOTS=(()=>{const a=[];for(let m=5*60;m<22*60;m+=30){
  a.push(pad(Math.floor(m/60))+":"+pad(m%60));}return a;})();
/* "09:00" → "09:00~09:30" 형태의 구간 표기 */
const slotEnd=t=>{const[h,m]=t.split(":").map(Number);
  const e=h*60+m+30;return pad(Math.floor(e/60)%24)+":"+pad(e%60);};
const BLOCKC=["#4E6E8E","#7A6A9B","#2F7D6E","#A2653C","#8E4A5E","#5B7A3E","#3E6E92","#8A6A3B"];
const hue=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%997;return BLOCKC[h%BLOCKC.length];};

/* ══ 렌더 ══ */
const $=id=>document.getElementById(id);
function render(){
  const d=ensureDay(cur),wk=mondayOf(cur),w=ensureWeek(wk);
  const dt=parse(cur);

    +(dt.getDay()===5?'<span class="badge" style="background:#DDE7F5;color:#204a86">주간일지</span>':"");

  renderBig($("weekBox"),w.big,"week");

  renderSubs(d);renderMemo(d);renderBacklog();renderRail(d);renderRit(d);
}

function saveBacklog(){db.bu=Date.now();save();}

const BL_COLLAPSE_AT=3;   // 완료 항목이 이 개수 이상이면 접어둠
let blShowDone=false;     // 완료 항목 펼침 여부 (새로고침하면 다시 접힘)

/* 항목 한 줄 만들기 */
function blRow(b){
  const el=document.createElement("div");
  el.className="blitem"+(b.done?" isdone":"");
  el.innerHTML='<input type="checkbox" class="chk">'
    +'<input type="text" class="bt" placeholder="중장기 과제·아이디어">'
    +'<input type="text" class="bw" placeholder="시기">'
    +'<button class="bdel" title="삭제">&times;</button>';
  const cb=el.querySelector(".chk"),
        ti=el.querySelector(".bt"),
        wi=el.querySelector(".bw"),
        del=el.querySelector(".bdel");

  cb.checked=b.done; ti.value=b.t; wi.value=b.w;
  ti.classList.toggle("done",b.done);
  wi.classList.toggle("done",b.done);

  /* 타이핑 중에는 다시 그리지 않음 (커서가 튀지 않도록) */
  ti.addEventListener("input",()=>{b.t=ti.value;saveBacklog();});
  wi.addEventListener("input",()=>{b.w=wi.value;saveBacklog();});

  /* 체크하면 목록 아래(완료 구역)로 내려감 */
  cb.addEventListener("change",()=>{
    b.done=cb.checked;
    if(b.done)blShowDone=false;      // 완료 처리하면 다시 접어둠
    saveBacklog();renderBacklog();
  });

  del.addEventListener("click",()=>{
    if(b.t.trim()&&!confirm("이 항목을 삭제할까요?\n\n"+b.t))return;
    const i=db.backlog.indexOf(b);   // 화면 순서가 아닌 실제 위치로 삭제
    if(i>-1)db.backlog.splice(i,1);
    saveBacklog();renderBacklog();
  });
  return el;
}

function renderBacklog(){
  const box=$("blBox");box.innerHTML="";
  if(!Array.isArray(db.backlog))db.backlog=[];

  const active=db.backlog.filter(b=>!b.done);
  const done  =db.backlog.filter(b=>b.done);

  if(!db.backlog.length){
    const e=document.createElement("div");e.className="blempty";
    e.textContent="아직 등록된 항목이 없습니다. 아래 버튼으로 추가하세요.";
    box.appendChild(e);
  }

  // ① 진행 중 항목 (추가한 순서 유지)
  active.forEach(b=>box.appendChild(blRow(b)));

  // ② 완료 항목 — 항상 아래로. 일정 개수를 넘으면 접어둠
  if(done.length){
    const collapsible=done.length>=BL_COLLAPSE_AT;
    const open=!collapsible||blShowDone;

    if(collapsible){
      const bar=document.createElement("div");
      bar.className="bldone-bar";
      bar.innerHTML='<button class="bltoggle">'+(open?"▾":"▸")+" 완료 "+done.length+"개"+(open?" 숨기기":" 보기")+"</button>"
        +'<span class="spacer"></span>'
        +(open?'<button class="blclear">완료 항목 비우기</button>':"");
      bar.querySelector(".bltoggle").onclick=()=>{blShowDone=!blShowDone;renderBacklog();};
      const clr=bar.querySelector(".blclear");
      if(clr)clr.onclick=()=>{
        if(!confirm("완료한 "+done.length+"개 항목을 모두 삭제할까요?"))return;
        db.backlog=db.backlog.filter(b=>!b.done);
        saveBacklog();renderBacklog();
      };
      box.appendChild(bar);
    }else{
      const sep=document.createElement("div");sep.className="bldone-sep";
      box.appendChild(sep);
    }

    if(open)done.forEach(b=>box.appendChild(blRow(b)));
  }

  updateBacklogSum();
}
function updateBacklogSum(){
  const el=$("blSum");if(!el)return;
  const list=db.backlog||[];
  const total=list.filter(b=>b.t.trim()).length;
  const done=list.filter(b=>b.t.trim()&&b.done).length;
  el.textContent=total?done+" / "+total:"";
}

function renderMemo(d){const m=$("memo");m.value=d.memo||"";

function renderRail(d){
  const rail=$("rail");rail.innerHTML="";
  const nowKey=key(new Date()),nowMin=new Date().getHours()*60+new Date().getMinutes();
  SLOTS.forEach((t,i)=>{
    const s=d.slots[t]||(d.slots[t]={p:"",a:""});
    if(s.p==null&&s.a)s.p=s.a;
    const row=document.createElement("div");row.className="slot";
    const hh=parseInt(t.slice(0,2),10);
    row.classList.add(hh<9?"band-dawn":hh<18?"band-work":"band-eve");
    if(t.endsWith(":00"))row.classList.add("hourtop");
    if(t==="12:00"||t==="12:30")row.classList.add("lunch");
    row.innerHTML=`<div class="t"><b>${t}</b><i>~${slotEnd(t)}</i></div><div class="spine"></div>
      <input class="plan" placeholder="">`;
    const ip=row.querySelector("input");
    ip.value=s.p||"";
    ip.addEventListener("input",()=>{s.p=ip.value;s.a="";save();});
    ip.addEventListener("change",()=>{paintRail(d);});
    if(cur===nowKey){const[h,mn]=t.split(":").map(Number);
      if(nowMin>=h*60+mn&&nowMin<h*60+mn+30)row.classList.add("now");}
    rail.appendChild(row);
  });
  paintRail(d);
  matchHeights();
}
function paintRail(d){
  const rows=[...$("rail").children];let prev="";
  rows.forEach((row,i)=>{
    const t=SLOTS[i],p=(d.slots[t]?.p||"").trim();
    const sp=row.querySelector(".spine");
    row.classList.remove("blockstart","blockcont");
    if(!p){sp.style.background="transparent";prev="";return;}
    sp.style.background=hue(p);
    if(p===prev){row.classList.add("blockcont");}else{row.classList.add("blockstart");}
    prev=p;
  });
  const filled=SLOTS.filter(t=>(d.slots[t]?.p||"").trim()).length;
  $("railSum").textContent=filled?`계획 ${(filled/2).toFixed(1)}h`:"";
}

function matchHeights(){
  const left=$("colLeft"),card=$("timeCard");
  if(!left||!card)return;
  if(window.innerWidth<=820){card.style.height="";return;}
  card.style.height="auto";
  requestAnimationFrame(()=>{
    const h=left.getBoundingClientRect().height;
    card.style.height=Math.max(h,360)+"px";
  });
}
window.addEventListener("resize",()=>matchHeights());
if(window.ResizeObserver){
  new ResizeObserver(()=>matchHeights()).observe(document.getElementById("colLeft")||document.body);
}

/* ══ 리츄얼 알림 ═══════════════════════════════════════════════
   미완료 항목을 전부 깜빡이면 금방 눈에 익어 무시하게 됩니다.
   그래서 "지금 할 시간대"의 미완료 항목만 맥박시킵니다. */
const RIT_WINDOW={          // 그룹별 활성 시간대 (시작시, 끝시)
  am:  [5,10],
  work:[9,18],
  pm:  [18,24]
};
function nudgeOn(){return db.settings.nudge!==false;}   // 기본 켜짐

/* 지금 시각에 해당하는 그룹 id 목록 */
function dueGroups(){
  const h=new Date().getHours();
  const ids=[];
  db.rituals.forEach(g=>{
    const w=RIT_WINDOW[g.id];
    if(!w){ids.push(g.id);return;}          // 사용자가 만든 그룹은 항상 대상
    if(h>=w[0]&&h<w[1])ids.push(g.id);
  });
  return ids;
}

/* 깜빡임 갱신 — 오늘 날짜이고 알림이 켜져 있을 때만 */
function paintNudge(d){
  const box=$("ritBox");if(!box)return;

  }

function renderRit(d){
  const box=$("ritBox");box.innerHTML="";

/* ══ 통계 및 보고서 로직 ══ */
const ST=b=>b.done?'<span class="st-done">완료</span>'
  :(b.subs&&b.subs.some(s=>s.done))?'<span class="st-ing">진행</span>'
  :'<span class="st-no">미착수</span>';
function fmD(k){const d=parse(k);return `${d.getMonth()+1}/${d.getDate()}`;}
function fmDW(k){const d=parse(k);return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;}

function buildDoc(wk){
  const days=weekDays(wk),w=ensureWeek(wk),s=db.settings;
  const wd=parse(wk),we=parse(addD(wk,4));
  const H=[];
  H.push(`<div class="doc">`);
  H.push(`<h1>주 간 업 무 보 고</h1>`);
  H.push(`<p class="period">${wd.getFullYear()}. ${wd.getMonth()+1}. ${wd.getDate()} (월) ~ ${we.getMonth()+1}. ${we.getDate()} (금)</p>`);

  H.push(`<h2>Ⅰ. 금주 중점 추진과제</h2><table>
    <colgroup><col style="width:34px"><col style="width:30%"><col><col style="width:62px"></colgroup>
    <tr><th>No</th><th>중점과제</th><th>추진 실적</th><th>진행</th></tr>`);
  let any=false;
  w.big.forEach((b,i)=>{
    if(!b.t.trim())return;any=true;
    const li=b.subs.filter(x=>x.t.trim())
      .map(x=>`<li>${esc(x.t)}${x.done?" <span class='st-done'>✓</span>":""}</li>`).join("");
    H.push(`<tr><td class="c">${i+1}</td><td>${esc(b.t)}</td>
      <td>${li?`<ul>${li}</ul>`:'<span class="empty">—</span>'}</td><td class="c">${ST(b)}</td></tr>`);
  });
  if(!any)H.push(`<tr><td colspan="4" class="c empty">등록된 중점과제가 없습니다</td></tr>`);
  H.push(`</table>`);

  H.push(`<h2>Ⅱ. 일자별 추진 내역</h2><table>
    <colgroup><col style="width:74px"><col style="width:24%"><col><col style="width:62px"></colgroup>
    <tr><th>일자</th><th>주요 업무</th><th>세부 내역</th><th>결과</th></tr>`);
  let rows=0;
  days.forEach(k=>{
    const d=db.days[k];if(!d)return;
    const items=[];
    d.big.forEach(b=>{if(b.t.trim())items.push({t:b.t,
      sub:b.subs.filter(x=>x.t.trim()).map(x=>x.t+(x.done?" ✓":"")),st:ST(b)});});
    const etc=d.subs.filter(x=>x.t.trim()).map(x=>x.t+(x.done?" ✓":""));
    if(etc.length)items.push({t:"기타 업무",sub:etc,
      st:etc.every(e=>e.endsWith("✓"))?'<span class="st-done">완료</span>':'<span class="st-ing">진행</span>'});
    if(!items.length)return;
    items.forEach((it,ii)=>{
      rows++;
      H.push(`<tr>${ii===0?`<td class="c" rowspan="${items.length}">${fmDW(k)}</td>`:""}
        <td>${esc(it.t)}</td>
        <td>${it.sub.length?`<ul>${it.sub.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:'<span class="empty">—</span>'}</td>
        <td class="c">${it.st}</td></tr>`);
    });
  });
  if(!rows)H.push(`<tr><td colspan="4" class="c empty">기록된 업무가 없습니다</td></tr>`);
  H.push(`</table>`);

  const st=periodStats(days);
  if(st.length){
    const tot=st.reduce((a,b)=>a+b.h,0);
    H.push(`<h2>Ⅲ. 업무 시간 배분 <span style="font-weight:400;font-size:11px;color:#6b675f">(총 ${tot.toFixed(1)}시간)</span></h2><table>
      <colgroup><col><col style="width:70px"><col style="width:64px"></colgroup>
      <tr><th>업무</th><th>투입시간</th><th>비중</th></tr>`);
    st.slice(0,10).forEach(x=>H.push(
      `<tr><td>${esc(x.label)}</td><td class="c">${x.h.toFixed(1)} h</td>
       <td class="c">${(x.h/tot*100).toFixed(0)}%</td></tr>`));
    H.push(`</table>`);
  }

  const notes=[];
  days.forEach(k=>{const d=db.days[k];if(d&&(d.memo||"").trim())
    notes.push(`<li><b>${fmD(k)}</b> ${esc(d.memo.trim()).replace(/\n/g,"<br>")}</li>`);});
  if(notes.length)H.push(`<h2>Ⅳ. 특이사항 및 협조 요청</h2>
    <table><tr><td><ul>${notes.join("")}</ul></td></tr></table>`);

  const nw=db.weeks[addD(wk,7)],plans=[];
  if(nw)nw.big.forEach(b=>{if(b.t.trim())plans.push(esc(b.t));});
  const pend=pendingOf(days);
  H.push(`<h2>${notes.length?"Ⅴ":"Ⅳ"}. 차주 계획 및 이월 사항</h2><table>
    <colgroup><col style="width:82px"><col></colgroup>`);
  H.push(`<tr><th>차주 계획</th><td>${plans.length?`<ul>${plans.map(p=>`<li>${p}</li>`).join("")}</ul>`
    :'<span class="empty">다음 주 Weekly Big3를 입력하면 자동으로 채워집니다</span>'}</td></tr>`);
  H.push(`<tr><th>이월 사항</th><td>${pend.length?`<ul>${pend.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`
    :'<span class="empty">없음</span>'}</td></tr></table>`);

  const today=new Date();
  H.push(`<p class="sign">${today.getFullYear()}. ${today.getMonth()+1}. ${today.getDate()}
    &nbsp;&nbsp; ${esc(s.dept||"")} &nbsp; ${esc(s.rank||"")} &nbsp; <b>${esc(s.name||"")}</b></p>`);
  H.push(`</div>`);
  return H.join("");
}
function pendingOf(days){
  const p=[];
  days.forEach(k=>{const d=db.days[k];if(!d)return;
    d.subs.forEach(s=>{if(s.t.trim()&&!s.done&&!p.includes(s.t.trim()))p.push(s.t.trim());});
    d.big.forEach(b=>{if(b.t.trim()&&!b.done&&!p.includes(b.t.trim()))p.push(b.t.trim());});});
  return p;
}
function periodStats(days){
  const m={};
  days.forEach(k=>{const d=db.days[k];if(!d)return;
    dayBlocks(d).forEach(b=>{m[b.label]=(m[b.label]||0)+b.n*0.5;});});
  return Object.entries(m).map(([label,h])=>({label,h})).sort((a,b)=>b.h-a.h);
}

function ritStats(days){
  const items=ritItems().filter(x=>x.type!=="note");
  const rec=days.filter(k=>{const d=db.days[k];
    return d&&(Object.values(d.rit||{}).some(Boolean));});
  const per=items.map(it=>({...it,n:rec.filter(k=>db.days[k].rit[it.id]).length}));
  const done=per.reduce((a,b)=>a+b.n,0),total=rec.length*items.length;
  const byDay=rec.map(k=>({k,r:items.filter(it=>db.days[k].rit[it.id]).length/items.length}));
  const byDow=[1,2,3,4,5,6,0].map(w=>{
    const l=byDay.filter(x=>parse(x.k).getDay()===w);
    return{w,r:l.length?l.reduce((a,b)=>a+b.r,0)/l.length:null};});
  const byGroup=db.rituals.map(g=>{
    const l=per.filter(x=>x.gid===g.id);
    const t=rec.length*l.length;
    return{id:g.id,name:g.name,r:t?l.reduce((a,b)=>a+b.n,0)/t:0};});
  return{items,rec,per,done,total,byDay,byDow,byGroup};
}
function weekDays(wk){const a=[];for(let i=0;i<7;i++){const k=addD(wk,i);if(db.days[k]||i<5)a.push(k);}return a;}
function buildReport(wk){
  const wd=parse(wk),days=weekDays(wk);
  const w=ensureWeek(wk);const L=[];
  const fm=k=>{const d=parse(k);return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;};
  L.push(`■ 주간 업무일지  ${fm(days[0])} ~ ${fm(days[Math.min(4,days.length-1)])}`);
  L.push("");
  L.push("【 주간 중점과제 】");
  w.big.forEach((b,i)=>{if(!b.t.trim())return;
    L.push(`${i+1}. ${b.t}${b.done?"  [완료]":""}`);
    b.subs.forEach(s=>{if(s.t.trim())L.push(`   ▶ ${s.t}${s.done?" [완료]":""}`);});
  });
  L.push("");
  L.push("【 일자별 실적 】");
  days.forEach(k=>{
    const d=db.days[k];if(!d)return;
    const lines=[];
    d.big.forEach(b=>{if(b.t.trim()){
      lines.push(`  · ${b.t}${b.done?" (완료)":" (진행)"}`);
      b.subs.forEach(s=>{if(s.t.trim()&&s.done)lines.push(`     - ${s.t}`);});}});
    d.subs.forEach(s=>{if(s.t.trim()&&s.done)lines.push(`  · ${s.t}`);});
    const blocks=dayBlocks(d);
    if(!lines.length&&!blocks.length&&!(d.memo||"").trim())return;
    L.push(`▶ ${fm(k)}`);
    if(lines.length)L.push(...lines);
    else if(blocks.length)L.push(...blocks.slice(0,6).map(b=>`  · ${b.label}`));
    if((d.memo||"").trim())L.push(`  ※ ${d.memo.trim().replace(/\n/g,"\n     ")}`);
  });
  const st=weekStats(wk);
  if(st.length){L.push("");L.push("【 시간 배분 】");
    st.slice(0,8).forEach(s=>L.push(`  · ${s.label} — ${s.h.toFixed(1)}h`));}
  const pend=[];
  days.forEach(k=>{const d=db.days[k];if(!d)return;
    d.subs.forEach(s=>{if(s.t.trim()&&!s.done&&!pend.includes(s.t.trim()))pend.push(s.t.trim());});
    d.big.forEach(b=>{if(b.t.trim()&&!b.done&&!pend.includes(b.t.trim()))pend.push(b.t.trim());});});
  if(pend.length){L.push("");L.push("【 미완료 · 다음 주 이월 】");pend.forEach(p=>L.push(`  · ${p}`));}
  return L.join("\n");
}
function dayBlocks(d){
  const out=[];let prev=null;
  SLOTS.forEach(t=>{const a=(d.slots?.[t]?.p||"").trim();
    if(!a){prev=null;return;}
    if(prev&&prev.label===a){prev.n++;}else{prev={label:a,n:1};out.push(prev);}});
  return out;
}
function weekStats(wk){
  const m={};
  weekDays(wk).forEach(k=>{const d=db.days[k];if(!d)return;
    dayBlocks(d).forEach(b=>{m[b.label]=(m[b.label]||0)+b.n*0.5;});});
  return Object.entries(m).map(([label,h])=>({label,h})).sort((a,b)=>b.h-a.h);
}

function drawStats(){
  const days=daysOfRange(),box=$("statBox");
  if(statMode==="time"){
    const st=periodStats(days),tot=st.reduce((a,b)=>a+b.h,0);
    if(!st.length){box.innerHTML='<p class="hint">시간표 "계획" 칸이 비어 있습니다. 시간대별로 무엇을 할지 적으면 여기서 합산됩니다.</p>';return;}
    const max=st[0].h;
    box.innerHTML=`<div class="kpis">
        <div class="kpi"><small>기록 합계</small><b>${tot.toFixed(1)}<i>h</i></b></div>
        <div class="kpi"><small>기록한 날</small><b>${days.filter(k=>dayBlocks(db.days[k]).length).length}<i>일</i></b></div>
        <div class="kpi"><small>업무 종류</small><b>${st.length}<i>건</i></b></div>
      </div>`+
      st.map(s=>`<div class="stat"><b>${esc(s.label)}</b><span>${s.h.toFixed(1)}h</span>
        <div class="bar"><i style="width:${s.h/max*100}%;background:${hue(s.label)}"></i></div></div>`).join("");
    return;
  }
  const r=ritStats(days);
  if(!r.rec.length){box.innerHTML='<p class="hint">아직 체크한 리츄얼이 없습니다.</p>';return;}
  const pct=v=>Math.round(v*100);
  const GC={am:"var(--dawn-ln)",work:"var(--work-ln)",pm:"var(--eve-ln)"};
  const best=[...r.per].sort((a,b)=>b.n-a.n).slice(0,5);
  const worst=[...r.per].sort((a,b)=>a.n-b.n).slice(0,5);
  const heat=r.byDay.slice(-28).map(x=>{
    const a=.12+x.r*.88;
    return `<i title="${fmDW(x.k)} ${pct(x.r)}%" style="background:rgba(59,122,92,${a.toFixed(2)})"></i>`;}).join("");
  const rowT=(l,n)=>`<tr><td>${esc(l.label)}<div class="mini-track">
      <i style="width:${r.rec.length?n/r.rec.length*100:0}%;background:${GC[l.gid]}"></i></div></td>
      <td class="n">${n}/${r.rec.length}</td></tr>`;
  box.innerHTML=`
    <div class="kpis">
      <div class="kpi"><small>전체 달성률</small><b>${pct(r.total?r.done/r.total:0)}<i>%</i></b></div>
      <div class="kpi"><small>기록한 날</small><b>${r.rec.length}<i>일</i></b></div>
      <div class="kpi"><small>완벽한 날</small><b>${r.byDay.filter(x=>x.r>=1).length}<i>일</i></b></div>
    </div>
    <div class="sechead">그룹별 달성률</div>
    ${r.byGroup.map(g=>`<div class="gbar"><b>${g.name.replace(" 리츄얼","")}</b>
      <div class="track"><i style="width:${pct(g.r)}%;background:${GC[g.id]}"></i></div>
      <span>${pct(g.r)}%</span></div>`).join("")}
    <div class="sechead">요일별 달성률</div>
    ${r.byDow.filter(d=>d.r!==null).map(d=>`<div class="gbar"><b>${DOW[d.w]}요일</b>
      <div class="track"><i style="width:${pct(d.r)}%;background:var(--week)"></i></div>
      <span>${pct(d.r)}%</span></div>`).join("")}
    <div class="sechead">최근 기록</div>
    <div class="heat">${heat}</div>
    <div class="sechead">잘 지킨 항목</div>
    <table class="tbl">${best.map(l=>rowT(l,l.n)).join("")}</table>
    <div class="sechead">자주 놓친 항목</div>
    <table class="tbl">${worst.map(l=>rowT(l,l.n)).join("")}</table>`;
}

$("fileIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
    const n=normalizeDB(JSON.parse(r.result));
    if(!n.days||!Object.keys(n.days).length)throw 0;
    const cnt=Object.keys(n.days).length;
    if(!confirm("백업 파일의 기록 "+cnt+"일치를 불러옵니다.\n\n"
      +"겹치는 날짜는 백업 파일 내용이 우선 적용되며, 클라우드에도 그대로 반영됩니다.\n"
      +"백업에 없는 날짜는 그대로 남습니다.\n\n계속할까요?"))return;

    /* 불러온 기록에는 수정 시각이 없어 '아주 오래된 것'으로 취급됩니다.
       그대로 두면 잠시 뒤 클라우드 데이터에 밀려 사라지므로,
       지금 시각을 찍어 이번 복원이 확실히 우선되도록 합니다. */
    const t=Date.now();
    Object.keys(n.days).forEach(k=>{n.days[k].u=t;db.days[k]=n.days[k];});
    Object.keys(n.weeks).forEach(k=>{n.weeks[k].u=t;db.weeks[k]=n.weeks[k];});
    if(n.rituals&&n.rituals.length)db.rituals=n.rituals;
    if(n.backlog&&n.backlog.length){db.backlog=n.backlog;db.bu=t;}
    if(n.font)db.font=n.font;

    applyFont(db.font);
    saveLocal();
    render();
    if(useFirebase){cloudSynced=true;pushCloud();}   // 복원본을 클라우드에 확정
    toast(cnt+"일치를 불러왔습니다");
  }catch(err){console.error(err);toast("백업 파일 형식이 아닙니다");}};
  r.readAsText(f);e.target.value="";};
$("btnPrint").onclick=()=>window.print();

const FONTS={
  sys:'system-ui,-apple-system,"Segoe UI","Malgun Gothic","맑은 고딕",sans-serif',
  hcr:'"HCR Dotum","함초롬돋움","HCR Dotum LVT","Malgun Gothic",sans-serif',
  hcrb:'"HCR Batang","함초롬바탕","HCR Batang LVT","Batang",serif',
  nanum:'"NanumGothic","나눔고딕","Nanum Gothic","Malgun Gothic",sans-serif',
  nanumj:'"NanumMyeongjo","나눔명조","Nanum Myeongjo","Batang",serif',
  dotum:'"Dotum","돋움",sans-serif',
  batang:'"Batang","바탕",serif',
  gulim:'"Gulim","굴림",sans-serif'
};
function applyFont(k){document.documentElement.style.setProperty("--sans",FONTS[k]||FONTS.sys);}
db.font=db.font||"sys";
$("fontSel").value=db.font;
applyFont(db.font);
$("fontSel").onchange=e=>{db.font=e.target.value;applyFont(db.font);save(true);
  toast("글씨체를 바꿨습니다");};

$("nudgeBtn").onclick=()=>{
  db.settings.nudge=!nudgeOn();
  save();
  paintNudge(ensureDay(cur));
  toast(nudgeOn()?"지금 시간대의 미완료 리츄얼을 알려드립니다":"리츄얼 알림을 껐습니다");
};

/* 시간대가 넘어가면(예: 오전→업무) 스스로 갱신 */
setInterval(()=>{try{paintNudge(ensureDay(cur));}catch(e){}},60*1000);

$("blAdd").onclick=()=>{
  if(!Array.isArray(db.backlog))db.backlog=[];
  db.backlog.push({t:"",w:"",done:false});
  saveBacklog();renderBacklog();
  const inputs=$("blBox").querySelectorAll(".bt");
  if(inputs.length)inputs[inputs.length-1].focus();
};
$("btnRestoreBackup").onclick=()=>{
  const backups=listBackups();
  if(!backups.length){
    alert("저장된 백업이 아직 없습니다.\n\n하루에 한 번, 처음 사용할 때 자동으로 저장됩니다.");
    return;
  }
  const opts=backups.map((b,i)=>{
    let n={d:0,w:0};
    try{const x=JSON.parse(store.getItem(b.key));n=dbSize(normalizeDB(x));}catch(e){}
    return "["+i+"] "+b.date+"  ("+b.kind+", "+n.d+"일 "+n.w+"주)";
  }).join("\n");
  const choice=prompt("복원할 백업을 선택하세요 (숫자):\n\n"+opts+"\n\n"
    +"※ 현재 기록과 합쳐지며, 내용이 있는 쪽이 우선됩니다.");
  if(choice===null)return;
  const idx=parseInt(choice);
  if(!(idx>=0&&idx<backups.length)){alert("잘못된 선택입니다");return;}
  if(confirm(backups[idx].date+" 백업으로 복원할까요?")){
    restoreBackup(backups[idx].key, backups[idx].date);
  }
};
$("btnLogout").onclick=()=>{if(confirm("로그아웃하시겠습니까?")){logout();alert("로그아웃되었습니다");}};
$("btnMore").onclick=e=>{e.stopPropagation();$("moreMenu").classList.toggle("open");};
document.addEventListener("click",e=>{
  if(!e.target.closest(".moreWrap"))$("moreMenu").classList.remove("open");});
$("moreMenu").addEventListener("click",e=>{
  if(e.target.tagName!=="SELECT")$("moreMenu").classList.remove("open");});

$("prev").onclick=()=>go(addD(cur,-1));
$("next").onclick=()=>go(addD(cur,1));
$("todayBtn").onclick=()=>go(key(new Date()));
$("datePick").onchange=e=>{if(e.target.value)go(e.target.value);};
function go(d){save(true);cur=d;render();window.scrollTo({top:0});}
document.addEventListener("keydown",e=>{
  if(e.altKey&&e.key==="ArrowLeft"){e.preventDefault();go(addD(cur,-1));}
  if(e.altKey&&e.key==="ArrowRight"){e.preventDefault();go(addD(cur,1));}
  if(e.key==="Escape")document.querySelectorAll(".modal.open").forEach(m=>m.classList.remove("open"));
});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.body.dataset.tab=b.dataset.tab;});

function download(name,text,type){const b=new Blob([text],{type:type+";charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1900);}
/* ══ 종료·백그라운드 전환 시 저장 ══
   모바일 브라우저는 beforeunload를 안 쏘는 경우가 많아 visibilitychange를 함께 사용 */
function flushSave(){clearTimeout(saveTimer);stamp();saveLocal();
  if(useFirebase&&cloudOnline)pushCloud();}
window.addEventListener("beforeunload",flushSave);
window.addEventListener("pagehide",flushSave);
document.addEventListener("visibilitychange",()=>{if(document.hidden)flushSave();});

/* =======================================================================
   클라우드 동기화
======================================================================= */

// 버전 표시 - 기기마다 같은 값이 보여야 정상
(function(){const el=document.getElementById("brandTag");
  if(el)el.textContent="일일계획표 "+APP_VER;})();

// 1) 화면부터 띄웁니다 (흰 화면 방지)
render();

function isTyping(){
  const a=document.activeElement;
  return !!a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA");
}
let pendingRemote=null;

function applyRemote(remote){
  snapshotBeforeRemote();
  applyingRemote=true;
  try{
    if(!cloudSynced)dropEmptyShells();   // 첫 수신: 빈 껍데기 제거 후 병합
    db=mergeDB(db,remote);
    applyFont(db.font);
    saveLocal();
    render();
    /* 이 기기에만 있던(또는 더 최신인) 기록은 다시 클라우드로 올려 양쪽을 맞춤 */
    if(mergeKeptLocal)setTimeout(()=>pushCloud(),0);
  }catch(e){
    console.error("[sync] 원격 데이터 반영 실패",e);
    flag("⚠ 데이터 형식 오류");
  }finally{
    applyingRemote=false;   // 동기 구간이므로 setTimeout 없이 즉시 해제
  }
}

/* 입력 중에는 화면을 갈아엎지 않고, 포커스가 빠질 때 반영 */
document.addEventListener("focusout",()=>{
  setTimeout(()=>{
    if(pendingRemote&&!isTyping()){const r=pendingRemote;pendingRemote=null;applyRemote(r);flag("☁ 최신으로 갱신됨");}
  },120);
});


/* ══════════════════════════════════════════════════════════════════
   ★ Firebase Authentication
====================================================================== */

let auth = null, currentUser = null;

// Firebase 초기화 (기존 SDK 다음에서 auth 생성)
if (useFirebase && fdb) {
  try {
    auth = firebase.auth();
    console.log("[auth] Firebase Auth 초기화 완료");
  } catch (e) {
    console.error("[auth] Firebase Auth 초기화 실패", e);
    useFirebase = false;
  }
}

/* 인증 상태 감시 — 사용자가 로그인/로그아웃하면 즉시 감지 */

/* 다중 기기 감시: 같은 사용자가 여러 곳에서 동시에 접속하면 감지 */
let lastSeenDeviceId = null;
let deviceConflictWarned = false;

function checkDeviceConflict(remote) {
  if (!remote || !remote._by) return;
  if (remote._by === CLIENT_ID) return;  // 내 기기라서 무시
  if (lastSeenDeviceId && lastSeenDeviceId !== remote._by) {
    // 다른 기기에서 변경이 감지됨
    if (!deviceConflictWarned) {
      toast("⚠️ 다른 기기에서 동시에 열려있을 수 있습니다. 충돌 위험이 있습니다.");
      deviceConflictWarned = true;
    }
  }
  lastSeenDeviceId = remote._by;
}

function initAuthListener() {
  if (!auth) return;
  auth.onAuthStateChanged((user) => {
    currentUser = user;
    const wall = document.getElementById("authWall");
    const main = document.getElementById("mainContent");
    if (!wall || !main) return;
    
    if (user) {
      // ✓ 로그인 됨 → 메인 화면 표시 및 클라우드 동기화 시작
      wall.style.display = "none";
      main.style.display = "block";
      console.log("[auth] 로그인:", user.email);
      
      // 클라우드 리스너 시작 (로그인 후에만)
      if (useFirebase && fdb && !cloudListenerActive) {
        startCloudSync();
      }
      
      // 자동 백업 스케줄 시작
      scheduleAutoBackup();
    } else {
      // ✗ 로그인 안 됨 → 로그인 화면 표시
      wall.style.display = "flex";
      main.style.display = "none";
      console.log("[auth] 로그아웃됨");
    }
  });
}

/* 로그인 폼 제출 */
const authForm = document.getElementById("authForm");
if (authForm) {
  authForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!auth) {
      alert("Firebase Auth를 사용할 수 없습니다");
      return;
    }

    const email = document.getElementById("authEmail").value;
    const password = document.getElementById("authPassword").value;
    const errorDiv = document.getElementById("authError");

    try {
      errorDiv.textContent = "로그인 중...";
      await auth.signInWithEmailAndPassword(email, password);
      errorDiv.textContent = "";
      authForm.reset();
      console.log("[auth] 로그인 성공");
    } catch (error) {
      console.error("[auth] 로그인 실패:", error.code, error.message);
      let msg = "로그인 실패";
      if (error.code === "auth/user-not-found") msg = "존재하지 않는 이메일입니다";
      else if (error.code === "auth/wrong-password") msg = "비밀번호가 틀렸습니다";
      else if (error.code === "auth/invalid-email") msg = "유효하지 않은 이메일입니다";
      else if (error.code === "auth/user-disabled") msg = "비활성화된 계정입니다";
      else if (error.code === "auth/too-many-requests") msg = "너무 많은 시도. 나중에 다시 시도하세요";
      errorDiv.textContent = msg;
    }
  });
}

/* 로그아웃 함수 */
function logout() {
  if (!auth) return;
  auth.signOut().then(() => {
    console.log("[auth] 로그아웃됨");
    currentUser = null;
  }).catch(err => {
    console.error("[auth] 로그아웃 실패:", err);
  });
}

function startCloudSync(){
  if(cloudListenerActive)return;
  cloudListenerActive=true;
  flag("클라우드 연결 중…");

  // 실제 연결 상태 추적
  fdb.ref(".info/connected").on("value",snap=>{
    cloudOnline=!!snap.val();
    if(currentUser){
      if(cloudOnline){
        if(pendingPush)pushCloud();
        else flag("☁ 연결됨");
      }else{
        flag("오프라인 · 기기에 저장됨");
      }
    }
  });

  fdb.ref(CLOUD_PATH).on("value",snapshot=>{
    const remote=snapshot.val();

    // (a) 내가 방금 올린 변경이 되돌아온 것 → 무시 (에코 루프·포커스 튕김 방지)
    if(remote&&remote._by===CLIENT_ID){cloudSynced=true;return;}

    // (b) 클라우드가 비어 있음 → 내 기록을 올려서 초기화
    if(!remote||!remote.days||Object.keys(remote.days).length===0){
      cloudSynced=true;
      if(db.days&&Object.keys(db.days).length>0)pushCloud();
      else flag("☁ 연결됨 (기록 없음)");
      return;
    }

    // (c) 다른 기기의 변경 → 입력 중이면 미뤘다가 반영
    checkDeviceConflict(remote);
    if(isTyping()){pendingRemote=remote;flag("☁ 새 변경 대기 중");return;}
    applyRemote(remote);
    cloudSynced=true;
    if(pendingPush)pushCloud();
    flag("☁ 동기화됨 "+new Date().toTimeString().slice(0,5));
  },err=>{
    // ★ 원래 코드에는 이 에러 콜백이 없어서, 규칙에 막혀도
    //   "클라우드 연결 중…"에서 영원히 멈춘 채 아무 안내가 없었습니다.
    console.error("[sync] 읽기 실패",err);
    useFirebase=false;
    flag(err&&err.code==="PERMISSION_DENIED"?"⚠ 규칙 거부 · 로컬 저장":"⚠ 클라우드 오류 · 로컬 저장");
    toast("클라우드에 접근할 수 없습니다. Firebase 보안 규칙을 확인하세요. (기록은 이 기기에 저장됩니다)");
  });
}

if(!useFirebase){
  flag("오프라인 모드");
  if(fbInitError)toast("클라우드 연결 실패 - 이 기기에만 저장됩니다");
}

/* 인증 리스너 시작 (가장 마지막에) */
initAuthListener();

/* 자동 백업 스케줄 시작 (클라우드 없이도 로컬 백업 유지) */
if(!useFirebase){
  scheduleAutoBackup();
}
</script>
